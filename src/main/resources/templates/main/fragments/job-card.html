<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(vaga)"
     class="jcard bg-bg2 border border-border2 rounded-[14px] p-[18px] mb-[13px] cursor-pointer transition-all duration-200 hover:border-border"
     th:data-modality="${vaga.modality}"
     th:data-level="${vaga.level}"
     th:attr="data-text=${#strings.toLowerCase((vaga.title != null ? vaga.title : '') + ' ' + (vaga.company != null ? vaga.company : '') + ' ' + (vaga.description != null ? vaga.description : '') + ' ' + #strings.listJoin(vaga.tags, ' '))}">
  <div class="flex items-center gap-[13px] mb-[10px]">
    <div class="w-[46px] h-[46px] rounded-[11px] shrink-0 flex items-center justify-center text-[18px] font-[800] text-white overflow-hidden"
         th:style="'background:' + ${vaga.companyLogo}">
      <span th:if="${vaga.companyLogoUrl == null or vaga.companyLogoUrl.isBlank()}"
            th:text="${vaga.company != null ? vaga.company.substring(0, 1).toUpperCase() : 'E'}">E</span>
    </div>
    <div>
      <div class="font-display text-[15px] font-semibold text-text1" th:text="${vaga.title}">Título da vaga</div>
      <div class="text-xs text-text2"
           th:text="${vaga.company} + ' · ' + ${vaga.location} + ' · ' + ${vaga.modality}">
        Empresa · Local · Modalidade
      </div>
    </div>
  </div>
  <div class="text-[13px] text-text3 leading-[1.65] mb-[10px]" th:text="${vaga.description}">Descrição da vaga.</div>
  <div class="flex gap-1 flex-wrap mb-[10px]">
    <div th:each="tag : ${vaga.tags}"
         class="text-[10px] py-[2px] px-2 rounded-[20px] bg-purplebg text-purple2 border border-border"
         th:text="${tag}">Tag</div>
    <div th:if="${vaga.level != null}"
         class="text-[10px] py-[2px] px-2 rounded-[20px] bg-[rgba(251,191,36,.09)] text-amber border border-[rgba(251,191,36,.22)]"
         th:text="${vaga.level}">Júnior</div>
  </div>
  <div class="flex items-center justify-between">
    <div th:if="${vaga.salary != null and !vaga.salary.isBlank()}"
         class="text-[11px] font-medium text-text3"
         th:text="${vaga.salary}">R$ 3.000 – 5.000</div>
    <div th:unless="${vaga.salary != null and !vaga.salary.isBlank()}" class="flex-1"></div>
    <button class="text-[13px] py-[7px] px-[20px] rounded-lg bg-purple text-white border-none font-[inherit] font-semibold cursor-pointer transition-all duration-200 hover:bg-purple2">Candidatar</button>
  </div>
</div>
</body>
</html>
