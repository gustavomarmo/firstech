<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal"
     class="overlay fixed inset-0 z-[100] bg-[rgba(7,10,16,.85)] backdrop-blur-[5px] flex items-center justify-center transition-opacity duration-[220ms]"
     id="job-overlay" onclick="handleJobOverlayClick(event)">
  <div class="bg-bg2 border border-border rounded-[18px] w-[640px] max-w-[95vw] shadow-[0_24px_60px_rgba(0,0,0,.6),0_0_0_1px_rgba(139,92,246,.12)] animate-modal-in flex flex-col overflow-hidden"
       id="job-modal">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-border2">
      <div class="flex items-center gap-[10px]">
        <div class="w-8 h-8 rounded-lg bg-purplebg border border-border flex items-center justify-center text-purple2 text-[17px]">
          <i class="ti ti-briefcase"></i>
        </div>
        <div>
          <div class="text-sm font-semibold text-text1" id="job-modal-heading">Nova vaga</div>
          <div class="text-[11px] text-text3" th:text="${usuario.empresa} != '' ? ${usuario.empresa} : ${usuario.nomeCompleto}">Empresa</div>
        </div>
      </div>
      <button class="w-[30px] h-[30px] rounded-lg border-none bg-bg3 text-text3 flex items-center justify-center cursor-pointer text-[18px] transition-all duration-200 hover:bg-bg4 hover:text-text1"
              onclick="closeJobModal()"><i class="ti ti-x"></i></button>
    </div>

    <!-- Campos -->
    <div class="p-5 flex flex-col gap-3 overflow-y-auto max-h-[70vh]">

      <!-- Título -->
      <input class="w-full bg-bg3 border border-border2 rounded-[9px] py-[10px] px-[14px] outline-none text-text1 font-[inherit] text-[17px] font-semibold font-display transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
             type="text" placeholder="Título da vaga" id="job-titulo"/>

      <!-- Linha: localidade + modalidade -->
      <div class="grid grid-cols-2 gap-3">
        <input class="bg-bg3 border border-border2 rounded-[9px] py-2 px-[14px] outline-none text-text1 font-[inherit] text-[13px] transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
               type="text" placeholder="Localidade (ex: São Paulo, SP)" id="job-localidade"/>
        <div class="relative">
          <select class="w-full appearance-none bg-bg3 border border-border2 rounded-[9px] py-2 pl-[14px] pr-9 outline-none text-text1 font-[inherit] text-[13px] transition-[border-color] duration-200 focus:border-border cursor-pointer"
                  id="job-modalidade">
            <option value="" disabled selected class="text-text3">Modalidade</option>
            <option value="Remoto">Remoto</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Presencial">Presencial</option>
          </select>
          <i class="ti ti-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-text3 text-sm pointer-events-none"></i>
        </div>
      </div>

      <!-- Linha: nível + salário -->
      <div class="grid grid-cols-2 gap-3">
        <div class="relative">
          <select class="w-full appearance-none bg-bg3 border border-border2 rounded-[9px] py-2 pl-[14px] pr-9 outline-none text-text1 font-[inherit] text-[13px] transition-[border-color] duration-200 focus:border-border cursor-pointer"
                  id="job-nivel">
            <option value="" disabled selected class="text-text3">Nível</option>
            <option value="Estágio">Estágio</option>
            <option value="Júnior">Júnior</option>
            <option value="Pleno">Pleno</option>
          </select>
          <i class="ti ti-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-text3 text-sm pointer-events-none"></i>
        </div>
        <input class="bg-bg3 border border-border2 rounded-[9px] py-2 px-[14px] outline-none text-text1 font-[inherit] text-[13px] transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
               type="text" placeholder="Salário (opcional, ex: R$ 3.000 – 5.000)" id="job-salario"/>
      </div>

      <!-- Descrição -->
      <textarea class="w-full min-h-[110px] bg-bg3 border border-border2 rounded-[9px] py-3 px-[14px] outline-none text-text1 font-[inherit] text-sm leading-[1.65] resize-none transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
                placeholder="Descrição da vaga, requisitos e responsabilidades..." id="job-descricao"></textarea>

      <!-- Tags de tecnologias -->
      <div>
        <div class="text-[11px] text-text3 mb-[6px]">Tecnologias / Tags</div>
        <div class="bg-bg3 border border-border2 rounded-[9px] py-2 px-3 flex flex-wrap gap-[7px] items-center cursor-text transition-[border-color] duration-200 focus-within:border-border"
             id="job-tags-area" onclick="document.getElementById('job-tag-input').focus()">
          <i class="ti ti-tag text-text3 text-sm shrink-0"></i>
          <div id="job-active-tags" class="flex flex-wrap gap-1.5 items-center flex-1">
            <input class="bg-transparent border-none outline-none text-text1 font-[inherit] text-xs min-w-[120px] flex-1 placeholder:text-text3"
                   id="job-tag-input" placeholder="Java, Spring Boot, AWS..." onkeydown="handleJobTagKey(event)">
          </div>
        </div>
      </div>

    </div>

    <div class="h-px bg-border2"></div>

    <!-- Rodapé -->
    <div class="py-3 px-5 pb-4 flex items-center justify-between border-t border-border2">
      <div class="text-[11px] text-text3">A vaga ficará visível para todos os candidatos.</div>
      <div class="flex gap-2 items-center">
        <button class="py-2 px-4 rounded-lg bg-transparent text-text2 border border-border2 font-[inherit] text-[13px] font-medium cursor-pointer transition-all duration-200 hover:bg-bg3 hover:text-text1"
                onclick="closeJobModal()">Cancelar</button>
        <button class="py-2 px-[22px] rounded-lg bg-purple text-white border-none font-[inherit] text-[13px] font-semibold cursor-pointer transition-all duration-200 hover:bg-purple2 flex items-center gap-[6px]"
                id="job-publish-btn" onclick="publishJob()">
          <i class="ti ti-send text-sm" id="job-publish-icon"></i><span id="job-publish-label">Publicar vaga</span>
        </button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
