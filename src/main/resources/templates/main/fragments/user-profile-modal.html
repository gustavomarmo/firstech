<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Drawer lateral de perfil de usuário.
  Desliza da direita. Clique no backdrop fecha.
-->
<div th:fragment="modal"
     class="overlay fixed inset-0 z-[150] bg-[rgba(7,10,16,.75)] backdrop-blur-[3px] flex justify-end transition-opacity duration-[250ms]"
     id="user-profile-overlay"
     onclick="if(event.target===this)closeUserProfile()">

  <!-- Drawer -->
  <div id="user-profile-drawer"
       class="bg-bg2 border-l border-border2 w-[620px] max-w-[100vw] h-full flex flex-col shadow-[-20px_0_60px_rgba(0,0,0,.55)]"
       style="transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)">

    <!-- ── Loading ── -->
    <div id="upm-loading" class="flex items-center justify-center flex-1">
      <div class="w-8 h-8 border-2 border-purple border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- ── Conteúdo (hidden até carregar) ── -->
    <div id="upm-content" class="hidden flex-col flex-1 overflow-hidden">

      <!-- ── Banner ── (SEM overflow-hidden para não cortar avatar) -->
      <div id="upm-banner"
           class="h-[120px] shrink-0 relative"
           style="background:linear-gradient(135deg,#0f0521 0%,#2d1b6e 40%,#0f172a 70%,#1a0533 100%)">
        <!-- Imagem do banner (clipping isolado) -->
        <div id="upm-banner-img-wrap" class="hidden absolute inset-0 overflow-hidden">
          <img id="upm-banner-img" src="" alt="" class="w-full h-full object-cover"/>
        </div>
        <!-- Overlay gradiente decorativo -->
        <div class="absolute inset-0 pointer-events-none"
             style="background:radial-gradient(circle at 30% 60%,rgba(139,92,246,.35) 0%,transparent 65%)"></div>
        <!-- Botão fechar -->
        <button onclick="closeUserProfile()"
                class="absolute top-3 right-3 w-8 h-8 rounded-lg bg-[rgba(7,10,16,.7)] border border-[rgba(255,255,255,.12)] text-white flex items-center justify-center cursor-pointer hover:bg-[rgba(7,10,16,.9)] transition-colors z-20">
          <i class="ti ti-x text-[16px]"></i>
        </button>
        <!-- Avatar overlapping banner -->
        <div class="absolute bottom-0 left-6 translate-y-1/2 z-10">
          <div id="upm-avatar"
               class="w-[80px] h-[80px] rounded-full border-4 border-bg2 overflow-hidden flex items-center justify-center text-[28px] font-bold text-white shrink-0"
               style="background:linear-gradient(135deg,#6d28d9,#8b5cf6)">
          </div>
        </div>
      </div>

      <!-- ── Corpo rolável ── -->
      <div class="overflow-y-auto flex-1 px-6 pb-8">

        <!-- Espaço para o avatar -->
        <div class="pt-[52px] mb-3 flex items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div id="upm-name" class="font-display text-[22px] font-bold text-text1 mb-[3px]"></div>
            <div id="upm-headline" class="text-sm text-text2 mb-1 leading-[1.5]"></div>
            <div class="text-[13px] text-text3 flex items-center gap-1">
              <i class="ti ti-map-pin text-[12px]"></i>
              <span id="upm-location-text">Localização não informada</span>
            </div>
          </div>
          <!-- Botão de conexão -->
          <button id="upm-connect-btn"
                  class="shrink-0 flex items-center gap-[6px] py-[7px] px-[14px] rounded-[9px] font-[inherit] text-[13px] font-semibold cursor-pointer transition-all duration-200"
                  onclick="handleConnectionAction()">
          </button>
        </div>

        <!-- Stats + ação mensagem -->
        <div class="flex items-center gap-5 pb-4 mb-5 border-b border-border2">
          <div>
            <div id="upm-connections" class="text-[17px] font-bold font-display text-purple2">0</div>
            <div class="text-[11px] text-text3">conexões</div>
          </div>
          <div class="flex-1"></div>
          <button id="upm-message-btn"
                  class="flex items-center gap-2 py-[7px] px-[14px] rounded-[9px] border border-border2 bg-bg3 text-text2 font-[inherit] text-[13px] font-medium cursor-pointer transition-all duration-200 hover:bg-bg4 hover:text-text1"
                  onclick="startMessageFromProfile()">
            <i class="ti ti-message-circle text-[15px]"></i>
            Enviar mensagem
          </button>
        </div>

        <!-- ── SOBRE ── -->
        <div id="upm-sobre-section" class="hidden mb-5">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[10px]">Sobre</div>
          <div id="upm-sobre" class="text-sm text-text2 leading-[1.8]"></div>
        </div>

        <!-- ── TECNOLOGIAS ── -->
        <div id="upm-tech-section" class="hidden mb-5">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[10px]">Tecnologias</div>
          <div id="upm-tech-chips" class="flex flex-wrap gap-[7px]"></div>
        </div>

        <!-- ── EXPERIÊNCIA ── -->
        <div id="upm-exp-section" class="hidden bg-bg3 border border-border2 rounded-[13px] p-[16px] mb-4">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[14px]">Experiência</div>
          <div id="upm-exp-list" class="flex flex-col gap-4"></div>
        </div>

        <!-- ── HABILIDADES ── -->
        <div id="upm-skills-section" class="hidden bg-bg3 border border-border2 rounded-[13px] p-[16px] mb-4">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[10px]">Habilidades</div>
          <div id="upm-skills-list" class="flex flex-wrap gap-[7px]"></div>
        </div>

        <!-- ── CERTIFICAÇÕES ── -->
        <div id="upm-cert-section" class="hidden bg-bg3 border border-border2 rounded-[13px] p-[16px] mb-4">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[12px]">Certificações</div>
          <div id="upm-cert-list" class="flex flex-col gap-3"></div>
        </div>

        <!-- ── PROJETOS ── -->
        <div id="upm-proj-section" class="hidden bg-bg3 border border-border2 rounded-[13px] p-[16px] mb-4">
          <div class="font-display text-[14px] font-semibold text-text1 mb-[12px]">Projetos</div>
          <div id="upm-proj-list" class="grid grid-cols-2 gap-[10px]"></div>
        </div>

      </div><!-- /body -->
    </div><!-- /upm-content -->
  </div><!-- /drawer -->
</div>
</body>
</html>
