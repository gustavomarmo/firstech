<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="search" class="screen" id="s-search">
  <div class="grid grid-cols-1 md:grid-cols-[248px_1fr] w-full h-full overflow-hidden">

    <!-- Coluna esquerda: perfil mini -->
    <div class="hidden md:block col p-[18px_16px] overflow-y-auto border-r border-border2">
      <div th:replace="~{main/fragments/profile-mini :: card(false)}"></div>
    </div>

    <!-- Coluna principal: área de busca -->
    <div class="col p-[18px_16px] overflow-y-auto bg-bg last:border-r-0">

      <!-- Campo de busca -->
      <div class="relative mb-[14px]">
        <i class="ti ti-search absolute left-[14px] top-1/2 -translate-y-1/2 text-text3 text-[17px]"></i>
        <input id="search-input"
               class="w-full py-[11px] px-4 pl-11 bg-bg2 border border-border rounded-[10px] text-text1 font-[inherit] text-sm outline-none transition-[border-color] duration-200 focus:border-purple2 placeholder:text-text3"
               type="text"
               placeholder="Buscar usuários, vagas, publicações..."
               oninput="searchDebounced(this.value)"
               autocomplete="off"/>
        <!-- Spinner de carregamento -->
        <i id="search-spinner"
           class="ti ti-loader-2 absolute right-[14px] top-1/2 -translate-y-1/2 text-purple2 text-[17px] hidden"
           style="animation:spin .7s linear infinite"></i>
      </div>

      <!-- Abas de filtro -->
      <div class="flex gap-1.5 mb-[14px]">
        <button class="ftab py-[5px] px-[14px] rounded-[20px] border border-border2 bg-transparent text-text2 font-[inherit] text-xs font-medium cursor-pointer transition-all duration-200 hover:border-border active"
                data-filter="tudo" onclick="setSearchFilter('tudo',this)">Tudo</button>
        <button class="ftab py-[5px] px-[14px] rounded-[20px] border border-border2 bg-transparent text-text2 font-[inherit] text-xs font-medium cursor-pointer transition-all duration-200 hover:border-border"
                data-filter="pessoa" onclick="setSearchFilter('pessoa',this)">Pessoas</button>
        <button class="ftab py-[5px] px-[14px] rounded-[20px] border border-border2 bg-transparent text-text2 font-[inherit] text-xs font-medium cursor-pointer transition-all duration-200 hover:border-border"
                data-filter="vaga" onclick="setSearchFilter('vaga',this)">Vagas</button>
        <button class="ftab py-[5px] px-[14px] rounded-[20px] border border-border2 bg-transparent text-text2 font-[inherit] text-xs font-medium cursor-pointer transition-all duration-200 hover:border-border"
                data-filter="post" onclick="setSearchFilter('post',this)">Publicações</button>
      </div>

      <!-- Contador de resultados -->
      <div id="search-count" class="text-xs text-text3 mb-3 hidden"></div>

      <!-- Resultados dinâmicos (preenchidos via JS) -->
      <div id="search-results"></div>

      <!-- Estado inicial (antes de digitar) -->
      <div id="search-empty-state" class="text-center py-12">
        <i class="ti ti-search text-[40px] text-text3 mb-3 block"></i>
        <div class="text-sm font-semibold text-text2 mb-1">Encontre pessoas, vagas e publicações</div>
        <div class="text-[13px] text-text3">Digite algo no campo acima para começar a busca</div>
      </div>

    </div>

  </div>
</div>
</body>
</html>
