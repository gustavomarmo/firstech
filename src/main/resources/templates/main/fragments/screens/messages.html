<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  #s-messages recebe display:flex do CSS (.screen.active) e flex:1 (fill height).
  Os filhos diretos são o painel esquerdo e o painel direito — sem wrapper extra.
-->
<div th:fragment="messages" class="screen overflow-hidden" id="s-messages">

  <!-- ── Painel esquerdo ── -->
  <div id="msg-left-panel" class="w-full md:w-[300px] shrink-0 border-r border-border2 flex flex-col bg-bg2 overflow-hidden">

    <!-- Header com título + tabs -->
    <div class="px-4 pt-3 pb-0 border-b border-border2 shrink-0">
      <div class="font-display text-[15px] font-bold text-text1 mb-3">Rede</div>
      <!-- Barra de abas -->
      <div class="flex gap-px">
        <button id="msg-tab-convs"
                onclick="switchMsgTab('convs')"
                class="msg-tab-btn flex-1 py-[7px] text-[11px] font-semibold cursor-pointer border-none font-[inherit] transition-all duration-150 border-b-2 border-purple2 text-purple2 bg-transparent">
          Conversas
        </button>
        <button id="msg-tab-people"
                onclick="switchMsgTab('people')"
                class="msg-tab-btn flex-1 py-[7px] text-[11px] font-semibold cursor-pointer border-none font-[inherit] transition-all duration-150 border-b-2 border-transparent text-text3 bg-transparent hover:text-text2">
          Pessoas
        </button>
        <button id="msg-tab-requests"
                onclick="switchMsgTab('requests')"
                class="msg-tab-btn relative flex-1 py-[7px] text-[11px] font-semibold cursor-pointer border-none font-[inherit] transition-all duration-150 border-b-2 border-transparent text-text3 bg-transparent hover:text-text2">
          Pedidos
          <span id="msg-requests-badge"
                class="hidden absolute -top-[3px] -right-[2px] min-w-[15px] h-[15px] rounded-full bg-purple text-white text-[8px] font-bold leading-none flex items-center justify-center px-[3px]">0</span>
        </button>
      </div>
    </div>

    <!-- ── ABA: Conversas ── -->
    <div id="msg-panel-convs" class="flex flex-col flex-1 overflow-hidden min-h-0">
      <div class="px-3 py-2 border-b border-border2 shrink-0">
        <div class="relative">
          <i class="ti ti-search absolute left-3 top-1/2 -translate-y-1/2 text-text3 text-[12px] pointer-events-none"></i>
          <input type="text" placeholder="Buscar conversa..."
                 id="msg-search-input"
                 oninput="filterConversations(this.value)"
                 class="w-full bg-bg3 border border-border2 rounded-[9px] py-[7px] pl-8 pr-3 outline-none text-text1 font-[inherit] text-[13px] placeholder:text-text3 focus:border-border transition-colors"/>
        </div>
      </div>
      <div id="conversations-list" class="flex-1 overflow-y-auto min-h-0">
        <div class="flex flex-col items-center justify-center py-12 gap-2 text-text3 text-sm" id="conv-empty" style="display:none!important">
          <i class="ti ti-message-off text-[28px]"></i>
          <span>Nenhuma conversa ainda</span>
          <span class="text-[11px] text-center px-4">Vá até a aba Pessoas e envie uma mensagem!</span>
        </div>
        <div id="conv-loading" class="flex items-center justify-center py-8">
          <div class="w-5 h-5 border-2 border-purple border-t-transparent rounded-full animate-spin"></div>
        </div>
      </div>
    </div>

    <!-- ── ABA: Pessoas ── -->
    <div id="msg-panel-people" class="hidden flex-col flex-1 overflow-hidden min-h-0">
      <div class="px-3 py-2 border-b border-border2 shrink-0">
        <div class="relative">
          <i class="ti ti-search absolute left-3 top-1/2 -translate-y-1/2 text-text3 text-[12px] pointer-events-none"></i>
          <input type="text" placeholder="Buscar pessoas..."
                 id="msg-people-search"
                 oninput="searchPeopleForMsg(this.value)"
                 autocomplete="off"
                 class="w-full bg-bg3 border border-border2 rounded-[9px] py-[7px] pl-8 pr-3 outline-none text-text1 font-[inherit] text-[13px] placeholder:text-text3 focus:border-border transition-colors"/>
        </div>
      </div>
      <div id="msg-people-results" class="flex-1 overflow-y-auto min-h-0">
        <div id="msg-people-section-label" class="px-4 pt-3 pb-1">
          <span class="text-[10px] font-semibold text-text3 uppercase tracking-wider">Todas as pessoas</span>
        </div>
        <div id="msg-connections-list">
          <div id="conn-msg-loading" class="flex items-center justify-center py-5">
            <div class="w-4 h-4 border-2 border-purple border-t-transparent rounded-full animate-spin"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── ABA: Pedidos de conexão ── -->
    <div id="msg-panel-requests" class="hidden flex-col flex-1 overflow-hidden min-h-0">
      <div id="msg-requests-list" class="flex-1 overflow-y-auto min-h-0">
        <div id="requests-loading" class="flex items-center justify-center py-8">
          <div class="w-5 h-5 border-2 border-purple border-t-transparent rounded-full animate-spin"></div>
        </div>
      </div>
    </div>

  </div><!-- /painel esquerdo -->

  <!-- ── Painel direito: conversa ativa ── -->
  <div id="msg-right-panel" class="flex-1 flex flex-col overflow-hidden bg-bg min-w-0">

    <!-- Estado vazio -->
    <div id="msg-empty-state" class="flex-1 flex flex-col items-center justify-center text-center px-8 gap-3">
      <div class="w-16 h-16 rounded-full bg-purplebg border border-border flex items-center justify-center text-[28px] text-purple2">
        <i class="ti ti-messages"></i>
      </div>
      <div class="font-display text-[17px] font-semibold text-text1">Suas mensagens</div>
      <div class="text-sm text-text3 max-w-[280px] leading-relaxed">
        Selecione uma conversa ou use a aba <strong class="text-purple2">Pessoas</strong> para iniciar uma nova.
      </div>
    </div>

    <!-- Conversa ativa -->
    <div id="msg-active" class="hidden flex-col flex-1 overflow-hidden min-h-0">

      <!-- Header da conversa -->
      <div class="flex items-center gap-2 px-3 md:px-5 py-[10px] border-b border-border2 shrink-0 bg-bg2">
        <button id="msg-back-btn"
                class="md:hidden w-8 h-8 rounded-lg border border-border2 bg-transparent text-text3 flex items-center justify-center cursor-pointer hover:bg-bg3 hover:text-text1 transition-colors shrink-0"
                onclick="mobileBackToConvs()">
          <i class="ti ti-arrow-left text-[14px]"></i>
        </button>
        <div id="msg-chat-avatar"
             class="w-9 h-9 rounded-full shrink-0 overflow-hidden flex items-center justify-center text-sm font-bold text-white"
             style="background:linear-gradient(135deg,#6d28d9,#8b5cf6)">
        </div>
        <div class="flex-1 min-w-0">
          <div id="msg-chat-name" class="text-[13px] font-semibold text-text1 truncate"></div>
          <div id="msg-chat-sub" class="text-[11px] text-text3"></div>
        </div>
        <button class="w-8 h-8 rounded-lg border border-border2 bg-transparent text-text3 flex items-center justify-center cursor-pointer hover:bg-bg3 hover:text-text1 transition-colors"
                title="Ver perfil completo"
                onclick="openUserProfileFromMsg()">
          <i class="ti ti-user text-[14px]"></i>
        </button>
      </div>

      <!-- Área de mensagens -->
      <div id="msg-messages-list" class="flex-1 overflow-y-auto min-h-0 px-5 py-4 flex flex-col gap-[10px]">
      </div>

      <!-- Input -->
      <div class="px-4 py-3 border-t border-border2 shrink-0 bg-bg2">
        <div class="flex gap-2 items-end bg-bg3 border border-border2 rounded-[12px] px-4 py-[10px] focus-within:border-border transition-colors">
          <textarea id="msg-input"
                    placeholder="Escreva uma mensagem..."
                    rows="1"
                    class="flex-1 bg-transparent border-none outline-none text-text1 font-[inherit] text-[13px] resize-none leading-[1.5] placeholder:text-text3 max-h-[120px]"
                    onkeydown="handleMsgKey(event)"
                    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <button onclick="sendActiveMessage()"
                  class="shrink-0 w-8 h-8 rounded-lg bg-purple border-none text-white flex items-center justify-center cursor-pointer hover:bg-purple2 transition-colors">
            <i class="ti ti-send text-sm"></i>
          </button>
        </div>
      </div>

    </div><!-- /msg-active -->
  </div><!-- /painel direito -->

</div>
</body>
</html>
