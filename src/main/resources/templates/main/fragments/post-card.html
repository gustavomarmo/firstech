<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(post)"
     class="bg-bg2 border border-border2 rounded-[14px] p-4 mb-[13px] transition-[border-color] duration-200 hover:border-border"
     th:id="'post-' + ${post.id}">

  <!-- Cabeçalho: avatar + autor + ações -->
  <div class="flex items-center gap-[10px] mb-3">
    <!-- Avatar: foto real ou iniciais -->
    <div class="w-10 h-10 rounded-full shrink-0 overflow-hidden flex items-center justify-center text-sm font-bold text-white cursor-pointer hover:opacity-90 transition-opacity"
         th:style="'background:' + ${post.autor.corAvatar}"
         th:onclick="'openUserProfile(' + ${post.autor.id} + ')'">
      <img th:if="${post.autor.avatarBase64 != null}"
           th:src="${post.autor.avatarBase64}"
           alt="avatar"
           class="w-full h-full object-cover"/>
      <span th:unless="${post.autor.avatarBase64 != null}"
            th:text="${post.autor.inicial}">A</span>
    </div>
    <div class="flex-1 min-w-0">
      <!-- Nome: apenas o texto é clicável (inline-block), não a linha inteira -->
      <div class="flex items-center gap-[6px] flex-wrap">
        <span class="text-sm font-semibold text-text1 cursor-pointer hover:text-purple2 transition-colors"
              th:text="${post.autor.nome}"
              th:onclick="'openUserProfile(' + ${post.autor.id} + ')'">Autor</span>
        <!-- Badge projeto -->
        <span th:if="${post.isProject}"
              class="inline-flex items-center gap-[3px] text-[9px] font-semibold px-[6px] py-[1px] rounded-full"
              style="background:rgba(139,92,246,.12);color:var(--purple2);border:1px solid rgba(139,92,246,.3)">
          <i class="ti ti-folder-code text-[9px]"></i>Projeto
        </span>
        <!-- Badge de status de conexão -->
        <span th:if="${post.autor.connectionStatus == 'ACCEPTED'}"
              class="text-[9px] font-semibold px-[6px] py-[1px] rounded-full bg-[rgba(52,211,153,.12)] text-green border border-[rgba(52,211,153,.25)]">Conectado</span>
        <span th:if="${post.autor.connectionStatus == 'PENDING_RECEIVED'}"
              class="text-[9px] font-semibold px-[6px] py-[1px] rounded-full bg-purplebg text-purple2 border border-border cursor-pointer"
              th:onclick="'openUserProfile(' + ${post.autor.id} + ')'">Quer se conectar</span>
      </div>
      <div class="text-[11px] text-text3 mt-[1px]"
           th:text="${post.autor.cargo} + ' · ' + ${post.tempoRelativo}">Cargo · tempo</div>
    </div>

    <!-- Ações do próprio autor -->
    <div th:if="${usuario.userId != null and post.autor.id == usuario.userId}"
         class="flex gap-1">
      <button class="w-[30px] h-[30px] rounded-lg border-none bg-transparent text-text3 flex items-center justify-center cursor-pointer text-[16px] transition-all duration-[180ms] hover:bg-bg3 hover:text-purple2"
              title="Editar post"
              th:data-post-id="${post.id}"
              th:data-post-title="${post.title}"
              th:data-post-content="${post.content}"
              th:data-post-tags="${#strings.listJoin(post.tags, ',')}"
              th:data-linked-job-id="${post.linkedJobId}"
              th:data-is-project="${post.isProject}"
              th:data-github-url="${post.githubUrl}"
              onclick="editPostFromBtn(this)">
        <i class="ti ti-pencil"></i>
      </button>
      <button class="w-[30px] h-[30px] rounded-lg border-none bg-transparent text-text3 flex items-center justify-center cursor-pointer text-[16px] transition-all duration-[180ms] hover:bg-bg3 hover:text-red"
              title="Excluir post"
              th:onclick="'deletePost(' + ${post.id} + ')'">
        <i class="ti ti-trash"></i>
      </button>
    </div>

  </div>

  <!-- Título (opcional) -->
  <div th:if="${post.title != null and !post.title.isBlank()}"
       class="font-display text-[15px] font-semibold text-text1 mb-1"
       th:text="${post.title}">Título do post</div>

  <!-- Conteúdo -->
  <div class="text-sm text-text2 leading-[1.7] mb-3" th:text="${post.content}">Conteúdo do post.</div>

  <!-- Tags -->
  <div th:if="${!#lists.isEmpty(post.tags)}" class="flex gap-1 flex-wrap mb-3">
    <div th:each="tag : ${post.tags}"
         class="text-[10px] py-[2px] px-2 rounded-[20px] bg-purplebg text-purple2 border border-border"
         th:text="${tag}">Tag</div>
  </div>

  <!-- Vaga vinculada (apenas quando presente) -->
  <div th:if="${post.linkedJobId != null}"
       class="flex items-center gap-[10px] bg-bg3 border border-border2 rounded-[10px] px-[12px] py-[9px] mb-3 cursor-pointer transition-all duration-200 hover:border-border"
       onclick="go('jobs')">
    <i class="ti ti-briefcase text-purple2 text-[15px]"></i>
    <div class="flex-1 min-w-0">
      <div class="text-[11px] text-text3 mb-[1px]">Vaga vinculada</div>
      <div class="text-xs font-semibold text-text1 truncate" th:text="${post.linkedJobTitle}">Título da vaga</div>
    </div>
    <i class="ti ti-arrow-right text-text3 text-sm"></i>
  </div>

  <!-- Ações: curtir, comentar, compartilhar -->
  <div class="flex gap-1">
    <!-- Curtir -->
    <button th:id="'like-btn-' + ${post.id}"
            th:data-post-id="${post.id}"
            th:data-liked="${post.likedByMe}"
            th:classappend="${post.likedByMe} ? ' text-red' : ' text-text3 hover:text-red'"
            class="like-btn flex items-center gap-[5px] py-[6px] px-[10px] rounded-[7px] border-none bg-transparent font-[inherit] text-xs cursor-pointer transition-all duration-200 hover:bg-bg3"
            th:onclick="'toggleLike(' + ${post.id} + ', this)'">
      <i th:class="${post.likedByMe} ? 'ti ti-heart-filled text-base' : 'ti ti-heart text-base'"></i>
      <span th:id="'like-count-' + ${post.id}" th:text="${post.likes}">0</span>
    </button>
    <!-- Comentar -->
    <button th:id="'comment-toggle-' + ${post.id}"
            class="flex items-center gap-[5px] py-[6px] px-[10px] rounded-[7px] border-none bg-transparent text-text3 font-[inherit] text-xs cursor-pointer transition-all duration-200 hover:bg-bg3 hover:text-purple2"
            th:onclick="'toggleComments(' + ${post.id} + ', this)'">
      <i class="ti ti-message-circle text-base"></i>
      <span th:id="'comment-count-' + ${post.id}" th:text="${post.commentCount}">0</span>
    </button>
    <!-- Compartilhar -->
    <button class="flex items-center gap-[5px] py-[6px] px-[10px] rounded-[7px] border-none bg-transparent text-text3 font-[inherit] text-xs cursor-pointer transition-all duration-200 hover:bg-bg3 hover:text-purple2"
            onclick="showJobToast('Feature em breve!')">
      <i class="ti ti-share text-base"></i>Compartilhar
    </button>
  </div>

  <!-- Seção de comentários (oculta; expandida via JS) -->
  <div th:id="'comments-' + ${post.id}" class="hidden mt-3 pt-3 border-t border-border2">
    <!-- Comentários carregados via JS -->
    <div th:id="'comments-list-' + ${post.id}" class="flex flex-col gap-[10px] mb-3"></div>
    <!-- Campo de novo comentário -->
    <div class="flex gap-[8px] items-start">
      <!-- Mini-avatar do usuário logado -->
      <div class="w-7 h-7 rounded-full shrink-0 overflow-hidden flex items-center justify-center text-[11px] font-bold text-white"
           th:style="'background:linear-gradient(135deg,#6d28d9,#8b5cf6)'">
        <img th:if="${usuario.avatarBase64 != null}" th:src="${usuario.avatarBase64}" alt="" class="w-full h-full object-cover"/>
        <span th:unless="${usuario.avatarBase64 != null}" th:text="${usuario.inicial}">G</span>
      </div>
      <div class="flex-1 flex gap-2 items-center bg-bg3 border border-border2 rounded-[9px] pr-2 transition-[border-color] focus-within:border-border">
        <input th:id="'comment-input-' + ${post.id}"
               type="text"
               placeholder="Escreva um comentário..."
               class="flex-1 bg-transparent border-none outline-none text-text1 font-[inherit] text-[13px] py-[8px] px-[12px] placeholder:text-text3"
               th:onkeydown="'handleCommentKey(event, ' + ${post.id} + ')'"/>
        <button class="shrink-0 w-7 h-7 rounded-lg bg-transparent border-none text-text3 cursor-pointer flex items-center justify-center hover:text-purple2 transition-colors"
                th:onclick="'submitComment(' + ${post.id} + ')'">
          <i class="ti ti-send text-sm"></i>
        </button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
