<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(showAvailBadge)" class="bg-bg2 border border-border2 rounded-[14px] mb-[14px] overflow-hidden">

  <!-- Capa — SEM overflow-hidden no wrapper externo para não cortar o avatar -->
  <div class="profile-cover h-[68px] relative"
       th:style="${usuario.bannerBase64 == null} ? 'background:linear-gradient(135deg,#1a0533 0%,#2d1b6e 50%,#0f172a 100%)' : ''">
    <!-- Banner em wrapper isolado para clipping sem afetar o avatar -->
    <div th:if="${usuario.bannerBase64 != null}"
         class="absolute inset-0 overflow-hidden">
      <img th:src="${usuario.bannerBase64}" alt="Banner" class="w-full h-full object-cover"/>
    </div>
  </div>

  <!-- Conteúdo: z-[1] garante que o avatar (com -mt-6) fica acima do banner -->
  <div class="px-[14px] pb-[14px] relative z-[1]">
    <div class="-mt-6 mb-2 flex items-end justify-between">
      <!-- Avatar: foto real ou iniciais -->
      <div class="w-[50px] h-[50px] rounded-full shrink-0 overflow-hidden border-[3px] border-bg2 flex items-center justify-center text-[18px] font-bold text-white font-display relative z-10"
           style="background:linear-gradient(135deg,#6d28d9,#8b5cf6)">
        <img th:if="${usuario.avatarBase64 != null}"
             th:src="${usuario.avatarBase64}"
             alt="Foto de perfil"
             class="w-full h-full object-cover"/>
        <span th:unless="${usuario.avatarBase64 != null}"
              th:text="${usuario.inicial}">G</span>
      </div>
    </div>
    <div class="font-display text-[15px] font-semibold text-text1 mb-0.5 truncate" th:text="${usuario.nomeCompleto}">Gustavo Marmo</div>
    <div class="text-xs text-text2 leading-[1.5] mb-[10px] line-clamp-2" th:text="${usuario.headline}">Back-end Dev · Java · Spring · AWS</div>
    <div class="grid grid-cols-2 gap-1.5">
      <div class="bg-bg3 rounded-[9px] p-[8px_10px]">
        <div class="text-[18px] font-bold font-display text-purple2" th:text="${usuario.conexoes}">512</div>
        <div class="text-[10px] text-text3 mt-px">Conexões</div>
      </div>
      <div class="bg-bg3 rounded-[9px] p-[8px_10px]">
        <div class="text-[18px] font-bold font-display text-purple2" th:text="${usuario.visualizacoes}">90</div>
        <div class="text-[10px] text-text3 mt-px">Visualizações</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
