<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(showAvailBadge)" class="bg-bg2 border border-border2 rounded-[14px] overflow-hidden mb-[14px]">
  <div class="profile-cover h-[68px] bg-[linear-gradient(135deg,#1a0533_0%,#2d1b6e_50%,#0f172a_100%)] relative"></div>
  <div class="px-[14px] pb-[14px]">
    <div class="-mt-6 mb-2 flex items-end justify-between">
      <div class="w-[50px] h-[50px] rounded-full shrink-0 bg-[linear-gradient(135deg,#6d28d9,#8b5cf6)] border-[3px] border-bg2 flex items-center justify-center text-[18px] font-bold text-white font-display"
           th:text="${usuario.inicial}">G</div>
      <div class="text-[10px] font-semibold py-[3px] px-[9px] bg-[rgba(52,211,153,.12)] text-green border border-[rgba(52,211,153,.28)] rounded-[20px]"
           th:if="${showAvailBadge}">● Disponível</div>
    </div>
    <div class="font-display text-[15px] font-semibold text-text1 mb-0.5" th:text="${usuario.nomeCompleto}">Gustavo Marmo</div>
    <div class="text-xs text-text2 leading-[1.5] mb-[10px]" th:text="${usuario.headline}">Back-end Dev · Java · Spring · AWS</div>
    <div class="grid grid-cols-2 gap-1.5">
      <div class="bg-bg3 rounded-[9px] p-[8px_10px]">
        <div class="text-[18px] font-bold font-display text-purple2" th:text="${usuario.conexoes}">512</div>
        <div class="text-[10px] text-text3 mt-px">Conexões</div>
      </div>
      <div class="bg-bg3 rounded-[9px] p-[8px_10px]">
        <div class="text-[18px] font-bold font-display text-purple2" th:text="${usuario.visualizacoes}">90</div>
        <div class="text-[10px] text-text3 mt-px">Visualizações</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
