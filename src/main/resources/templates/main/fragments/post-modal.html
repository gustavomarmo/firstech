<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal"
     class="overlay fixed inset-0 z-[100] bg-[rgba(7,10,16,.85)] backdrop-blur-[5px] flex items-center justify-center transition-opacity duration-[220ms]"
     id="post-overlay" onclick="handleOverlayClick(event)">
  <div class="bg-bg2 border border-border rounded-[18px] w-[620px] max-w-[95vw] shadow-[0_24px_60px_rgba(0,0,0,.6),0_0_0_1px_rgba(139,92,246,.12)] animate-modal-in flex flex-col overflow-hidden"
       id="post-modal">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-border2">
      <div class="flex items-center gap-[10px] mb-0.5">
        <div class="w-9 h-9 rounded-full shrink-0 bg-[linear-gradient(135deg,#6d28d9,#8b5cf6)] border-[3px] border-bg2 flex items-center justify-center text-[13px] font-bold text-white font-display"
             th:text="${usuario.inicial}">G</div>
        <div>
          <div class="text-sm font-semibold text-text1" id="post-modal-heading">Novo post</div>
          <div class="text-[11px] text-text3"
               th:text="${usuario.empresa != null and !usuario.empresa.isBlank()} ? ${usuario.cargo} + ' · ' + ${usuario.empresa} : ${usuario.cargo}">Cargo</div>
        </div>
      </div>
      <button class="w-[30px] h-[30px] rounded-lg border-none bg-bg3 text-text3 flex items-center justify-center cursor-pointer text-[18px] transition-all duration-200 hover:bg-bg4 hover:text-text1"
              onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>

    <!-- Campos -->
    <div class="p-5 flex flex-col gap-3 overflow-y-auto max-h-[70vh]">

      <!-- Título (opcional — placeholder muda por papel) -->
      <input class="w-full bg-bg3 border border-border2 rounded-[9px] py-[10px] px-[14px] outline-none text-text1 font-[inherit] text-[17px] font-semibold font-display transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
             type="text"
             th:placeholder="${usuario.recrutador} ? 'Título da atualização (opcional)' : 'Título do projeto (opcional)'"
             id="modal-title"/>

      <!-- Conteúdo (obrigatório — placeholder muda por papel) -->
      <textarea class="w-full min-h-[130px] bg-bg3 border border-border2 rounded-[9px] py-3 px-[14px] outline-none text-text1 font-[inherit] text-sm leading-[1.65] resize-none transition-[border-color] duration-200 focus:border-border placeholder:text-text3"
                th:placeholder="${usuario.recrutador} ? 'Compartilhe uma atualização, novidade ou destaque uma conquista...' : 'Descreva seu projeto, conquista ou aprendizado...'"
                id="modal-desc"></textarea>

      <!-- Vincular à vaga — apenas recrutadores -->
      <div th:if="${usuario.recrutador}" class="relative">
        <select id="modal-linked-job"
                class="w-full appearance-none bg-bg3 border border-border2 rounded-[9px] py-2 pl-[14px] pr-9 outline-none text-text1 font-[inherit] text-[13px] transition-[border-color] duration-200 focus:border-border cursor-pointer">
          <option value="">Vincular à uma vaga ativa (opcional)</option>
          <th:block th:each="vaga : ${minhasVagas}">
            <option th:if="${vaga.status == 'ATIVA'}"
                    th:value="${vaga.id}"
                    th:text="${vaga.title}">Vaga</option>
          </th:block>
        </select>
        <i class="ti ti-link absolute right-3 top-1/2 -translate-y-1/2 text-text3 text-sm pointer-events-none"></i>
      </div>

      <!-- Marcar como projeto — apenas candidatos -->
      <div th:unless="${usuario.recrutador}"
           id="project-toggle-row"
           class="flex items-center justify-between py-[10px] px-[14px] bg-bg3 border border-border2 rounded-[9px] cursor-pointer select-none transition-[border-color] duration-200 hover:border-border"
           onclick="toggleProjectFlag()">
        <div class="flex items-center gap-[10px]">
          <i class="ti ti-folder-code text-[18px]" style="color:var(--purple2)"></i>
          <div>
            <div class="text-[13px] font-semibold text-text1">Marcar como projeto</div>
            <div class="text-[11px] text-text3">Aparece na aba Projetos do seu perfil</div>
          </div>
        </div>
        <div id="project-toggle-switch"
             class="relative w-[38px] h-[22px] rounded-full bg-bg4 border border-border2 transition-colors duration-200 shrink-0">
          <div id="project-toggle-knob"
               class="absolute top-[3px] left-[3px] w-[14px] h-[14px] rounded-full bg-text3 transition-all duration-200"></div>
        </div>
      </div>

      <!-- Link do GitHub (oculto por padrão; exibido ao clicar no botão GitHub) -->
      <div id="github-url-row"
           style="display:none"
           class="flex items-center gap-2 bg-bg3 border border-border2 rounded-[9px] py-[8px] px-3 transition-[border-color] duration-200 focus-within:border-border">
        <i class="ti ti-brand-github text-text3 text-sm shrink-0"></i>
        <input id="modal-github-url"
               type="url"
               placeholder="https://github.com/usuario/repositorio"
               class="flex-1 bg-transparent border-none outline-none text-text1 font-[inherit] text-[13px] placeholder:text-text3"/>
        <button type="button"
                class="shrink-0 text-text3 bg-transparent border-none cursor-pointer hover:text-red transition-colors text-[16px] flex items-center"
                onclick="toggleGithubInput()"><i class="ti ti-x"></i></button>
      </div>

      <!-- Tags -->
      <div class="bg-bg3 border border-border2 rounded-[9px] py-2 px-3 flex flex-wrap gap-[7px] items-center cursor-text transition-[border-color] duration-200 focus-within:border-border"
           id="tags-area" onclick="document.getElementById('tag-input').focus()">
        <i class="ti ti-tag text-text3 text-sm shrink-0"></i>
        <div id="active-tags" class="flex flex-wrap gap-1.5 items-center flex-1">
          <input class="bg-transparent border-none outline-none text-text1 font-[inherit] text-xs min-w-[120px] flex-1 placeholder:text-text3"
                 id="tag-input" placeholder="adicionar tags..." onkeydown="handleTagKey(event)">
        </div>
      </div>

    </div>

    <div class="h-px bg-border2"></div>

    <!-- Rodapé -->
    <div class="py-3 px-5 pb-4 flex items-center justify-between border-t border-border2">
      <div class="flex gap-0.5">
        <button class="w-[34px] h-[34px] rounded-lg border-none bg-transparent text-text3 flex items-center justify-center cursor-pointer text-[18px] transition-all duration-[180ms] hover:bg-bg3 hover:text-purple2" title="Código"><i class="ti ti-code"></i></button>
        <button class="w-[34px] h-[34px] rounded-lg border-none bg-transparent text-text3 flex items-center justify-center cursor-pointer text-[18px] transition-all duration-[180ms] hover:bg-bg3 hover:text-purple2" title="Imagem"><i class="ti ti-photo"></i></button>
        <button id="github-toggle-btn"
                class="w-[34px] h-[34px] rounded-lg border-none bg-transparent text-text3 flex items-center justify-center cursor-pointer text-[18px] transition-all duration-[180ms] hover:bg-bg3 hover:text-purple2"
                title="Link do GitHub"
                onclick="toggleGithubInput()"><i class="ti ti-brand-github"></i></button>
      </div>
      <div class="flex gap-2 items-center">
        <button class="py-2 px-4 rounded-lg bg-transparent text-text2 border border-border2 font-[inherit] text-[13px] font-medium cursor-pointer transition-all duration-200 hover:bg-bg3 hover:text-text1"
                onclick="closeModal()">Cancelar</button>
        <button class="py-2 px-[22px] rounded-lg bg-purple text-white border-none font-[inherit] text-[13px] font-semibold cursor-pointer transition-all duration-200 hover:bg-purple2 flex items-center gap-[6px]"
                id="post-publish-btn" onclick="publishPost()">
          <i class="ti ti-send text-sm" id="post-publish-icon"></i>
          <span id="post-publish-label">Publicar</span>
        </button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
