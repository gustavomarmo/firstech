<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | Firstech'">Firstech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: { extend: { colors: {
            'ft-bg':      '#0d1117',
            'ft-surface': '#151b24',
            'ft-border':  'rgba(139,92,246,0.22)',
            'ft-purple':  '#8b5cf6',
            'ft-text':    '#f0f4ff',
            'ft-muted':   '#94a3b8',
          }}}
        }
    </script>
</head>
<body class="bg-ft-bg text-ft-text min-h-screen flex flex-col overflow-hidden">

<div th:replace="~{main/fragments/topbar :: topbar(${user})}"></div>

<main class="flex-1 overflow-hidden" th:replace="${content}"></main>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
