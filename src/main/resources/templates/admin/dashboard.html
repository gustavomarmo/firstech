<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — Firstech</title>

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Tema (FOUC prevention) -->
  <script th:src="@{/js/theme.js}"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script th:src="@{/js/tailwindConfig.js}"></script>

  <style>
    /* ── Tema escuro (padrão) ── */
    :root, [data-theme="dark"] {
      --bg:#0d1117;--bg2:#151b24;--bg3:#1c2535;--bg4:#222d3f;
      --purple:#8b5cf6;--purple2:#a78bfa;--purple3:#6d28d9;
      --purplebg:rgba(139,92,246,0.12);--border:rgba(139,92,246,0.22);
      --border2:rgba(255,255,255,0.07);
      --text1:#f0f4ff;--text2:#94a3b8;--text3:#64748b;
      --green:#34d399;--red:#f87171;--amber:#fbbf24;
    }
    /* ── Tema claro ── */
    [data-theme="light"] {
      --bg:#f1f5f9;--bg2:#ffffff;--bg3:#f8fafc;--bg4:#eef2f7;
      --purple:#8b5cf6;--purple2:#7c3aed;--purple3:#6d28d9;
      --purplebg:rgba(139,92,246,0.09);--border:rgba(109,40,217,0.28);
      --border2:rgba(15,23,42,0.09);
      --text1:#0f172a;--text2:#334155;--text3:#64748b;
      --green:#059669;--red:#dc2626;--amber:#d97706;
    }

    body { font-family:'DM Sans',sans-serif; }
    .font-display { font-family:'Space Grotesk',sans-serif; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--bg4);border-radius:4px; }

    /* Nav ativo — igual ao topbar principal */
    .nav-btn { transition:background .15s,color .15s; }
    .nav-btn.active { background:var(--purplebg); color:var(--purple2); }

    /* Dropdown animation */
    @keyframes menuIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    #user-menu:not(.hidden) { animation:menuIn .18s ease; }

    /* Cards */
    .kpi-card {
      background:var(--bg2);border:1px solid var(--border2);
      border-radius:14px;padding:18px 20px;
      transition:border-color .2s,transform .15s;
    }
    .kpi-card:hover { border-color:var(--border);transform:translateY(-1px); }

    .panel {
      background:var(--bg2);border:1px solid var(--border2);border-radius:14px;
    }
    .panel-header { padding:16px 20px;border-bottom:1px solid var(--border2); }
    .panel-body   { padding:20px; }
  </style>
</head>

<body class="bg-bg text-text1 min-h-screen">

<!-- ══════════════════════════════════════════════════
     TOPBAR — igual ao principal, mas só com Dashboard
══════════════════════════════════════════════════ -->
<header class="sticky top-0 z-30 flex items-center justify-between px-7 h-[58px] bg-bg2 border-b border-border2 shrink-0">

  <!-- Logo -->
  <div class="font-display text-[19px] font-bold flex items-center gap-px select-none">
    <span class="text-text3 font-light">&lt;</span>
    <span class="text-purple2">first</span>
    <span class="text-text3 font-light">&gt;</span>
    <span class="text-text1">tech</span>
  </div>

  <!-- Navegação central — só a aba Dashboard -->
  <nav class="flex gap-1">
    <a href="/admin/dashboard"
       class="nav-btn active flex items-center gap-[7px] px-[18px] py-2 rounded-[9px] border border-transparent text-sm font-medium no-underline">
      <i class="ti ti-chart-bar text-[17px]"></i>Dashboard
    </a>
  </nav>

  <!-- Ações à direita -->
  <div class="flex items-center gap-[10px]">

    <!-- Avatar do admin com dropdown -->
    <div class="relative" id="user-avatar-container">
      <button id="user-avatar-btn"
              onclick="toggleUserMenu(event)"
              class="w-9 h-9 rounded-full cursor-pointer border-2 border-border overflow-hidden flex items-center justify-center p-0 focus:outline-none"
              style="background:linear-gradient(135deg,#6d28d9,#8b5cf6)"
              title="Menu do usuário">
        <img th:if="${adminAvatar != null}" th:src="${adminAvatar}" alt="Avatar" class="w-full h-full object-cover"/>
        <span th:if="${adminAvatar == null}"
              class="text-[13px] font-bold text-white leading-none"
              th:text="${adminNome != null ? #strings.substring(adminNome,0,1).toUpperCase() : 'A'}">A</span>
      </button>

      <!-- Dropdown -->
      <div id="user-menu"
           class="hidden absolute right-0 top-full mt-2 w-[200px] bg-bg2 border border-border rounded-[13px] shadow-[0_12px_40px_rgba(0,0,0,.65)] overflow-hidden z-50">
        <div class="px-4 py-3 border-b border-border2">
          <div class="text-[13px] font-semibold text-text1 truncate" th:text="${adminNome}">Administrador</div>
          <div class="flex items-center gap-[5px] mt-[2px]">
            <span class="text-[10px] font-bold px-[6px] py-[1px] rounded-full"
                  style="background:var(--purplebg);color:var(--purple2);border:1px solid var(--border)">
              ADMIN
            </span>
          </div>
        </div>
        <div class="py-1">
          <!-- Alternar tema -->
          <button class="w-full flex items-center gap-3 px-4 py-[10px] text-[13px] text-text2 hover:bg-bg3 hover:text-text1 transition-colors font-[inherit] border-none bg-transparent cursor-pointer"
                  onclick="toggleTheme(); closeUserMenu()">
            <i id="theme-icon" class="ti ti-sun text-[16px] text-text3"></i>
            <span id="theme-label">Tema claro</span>
          </button>
        </div>
        <div class="h-px bg-border2"></div>
        <div class="py-1">
          <button class="w-full flex items-center gap-3 px-4 py-[10px] text-[13px] text-red hover:bg-bg3 transition-colors font-[inherit] border-none bg-transparent cursor-pointer"
                  onclick="doLogout()">
            <i class="ti ti-logout text-[16px]"></i>Sair
          </button>
        </div>
      </div>
    </div><!-- /user-avatar-container -->

  </div>
</header>

<!-- ══════════════════════════════════════════════════
     CONTEÚDO PRINCIPAL
══════════════════════════════════════════════════ -->
<main class="max-w-7xl mx-auto px-6 py-8">

  <!-- Título -->
  <div class="flex items-start justify-between mb-7 flex-wrap gap-4">
    <div>
      <h1 class="font-display text-[26px] font-bold text-text1 leading-tight mb-[4px]">Dashboard</h1>
      <p class="text-sm text-text3">Visão geral da plataforma Firstech</p>
    </div>
    <div class="flex items-center gap-[7px] text-[12px] text-text3 bg-bg2 border border-border2 rounded-[9px] px-3 py-2">
      <i class="ti ti-circle-dot text-[12px]" style="color:var(--green)"></i>
      Dados em tempo real
    </div>
  </div>

  <!-- ════ KPI CARDS (5 cards) ════ -->
  <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-4 mb-7">

    <!-- Total de usuários -->
    <div class="kpi-card">
      <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mb-3"
           style="background:rgba(139,92,246,.12)">
        <i class="ti ti-users text-[18px]" style="color:var(--purple2)"></i>
      </div>
      <div class="font-display text-[28px] font-bold text-text1 leading-none mb-1"
           th:text="${stats.totalUsuarios}">0</div>
      <div class="text-[11px] font-medium text-text3">Total de usuários</div>
    </div>

    <!-- Candidatos -->
    <div class="kpi-card">
      <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mb-3"
           style="background:rgba(52,211,153,.1)">
        <i class="ti ti-code text-[18px]" style="color:var(--green)"></i>
      </div>
      <div class="font-display text-[28px] font-bold text-text1 leading-none mb-1"
           th:text="${stats.totalCandidatos}">0</div>
      <div class="text-[11px] font-medium text-text3">Candidatos</div>
    </div>

    <!-- Recrutadores -->
    <div class="kpi-card">
      <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mb-3"
           style="background:rgba(251,191,36,.1)">
        <i class="ti ti-briefcase text-[18px]" style="color:var(--amber)"></i>
      </div>
      <div class="font-display text-[28px] font-bold text-text1 leading-none mb-1"
           th:text="${stats.totalRecrutadores}">0</div>
      <div class="text-[11px] font-medium text-text3">Recrutadores</div>
    </div>

    <!-- Vagas ativas -->
    <div class="kpi-card">
      <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mb-3"
           style="background:rgba(96,165,250,.1)">
        <i class="ti ti-briefcase-check text-[18px]" style="color:#60a5fa"></i>
      </div>
      <div class="font-display text-[28px] font-bold text-text1 leading-none mb-1"
           th:text="${stats.vagasAtivas}">0</div>
      <div class="text-[11px] font-medium text-text3">Vagas ativas</div>
      <div class="text-[10px] text-text3 mt-[3px]"
           th:text="${stats.vagasEncerradas} + ' encerradas'">0 encerradas</div>
    </div>

    <!-- Posts -->
    <div class="kpi-card">
      <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mb-3"
           style="background:rgba(248,113,113,.08)">
        <i class="ti ti-file-text text-[18px]" style="color:var(--red)"></i>
      </div>
      <div class="font-display text-[28px] font-bold text-text1 leading-none mb-1"
           th:text="${stats.totalPosts}">0</div>
      <div class="text-[11px] font-medium text-text3">Posts publicados</div>
    </div>

  </div>

  <!-- ════ GRÁFICOS — LINHA 1 ════ -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">

    <!-- Tipo de usuário (doughnut) -->
    <div class="panel">
      <div class="panel-header">
        <h3 class="font-display text-[14px] font-semibold text-text1 flex items-center gap-2">
          <i class="ti ti-users text-[15px] text-text3"></i>Distribuição de usuários
        </h3>
      </div>
      <div class="panel-body flex items-center justify-center" style="height:230px">
        <canvas id="chartUserType"></canvas>
      </div>
    </div>

    <!-- Vagas por modalidade (doughnut) -->
    <div class="panel">
      <div class="panel-header">
        <h3 class="font-display text-[14px] font-semibold text-text1 flex items-center gap-2">
          <i class="ti ti-map-pin text-[15px] text-text3"></i>Vagas por modalidade
        </h3>
      </div>
      <div class="panel-body flex items-center justify-center" style="height:230px">
        <canvas id="chartModalidade"></canvas>
      </div>
    </div>

    <!-- Vagas por nível (bar) -->
    <div class="panel">
      <div class="panel-header">
        <h3 class="font-display text-[14px] font-semibold text-text1 flex items-center gap-2">
          <i class="ti ti-chart-bar text-[15px] text-text3"></i>Vagas por nível
        </h3>
      </div>
      <div class="panel-body" style="height:230px">
        <canvas id="chartNivel" style="width:100%;height:100%"></canvas>
      </div>
    </div>

  </div>

  <!-- ════ TOP POSTADORES ════ -->
  <div class="panel mb-5">
    <div class="panel-header">
      <h3 class="font-display text-[14px] font-semibold text-text1 flex items-center gap-2">
        <i class="ti ti-podium text-[15px] text-text3"></i>Top 5 postadores
      </h3>
    </div>
    <div class="panel-body" style="height:240px">
      <canvas id="chartTopPosters" style="width:100%;height:100%"></canvas>
    </div>
  </div>

</main>

<!-- ════ DADOS PARA OS GRÁFICOS ════ -->
<script th:inline="javascript">
/*<![CDATA[*/
const STATS_CANDIDATOS   = /*[[${stats.totalCandidatos}]]*/   0;
const STATS_RECRUTADORES = /*[[${stats.totalRecrutadores}]]*/ 0;
const MODALIDADE_DATA    = /*[[${stats.vagasPorModalidade}]]*/ {};
const NIVEL_DATA         = /*[[${stats.vagasPorNivel}]]*/     {};
const TOP_POSTER_NAMES   = /*[[${topPosterNames}]]*/           [];
const TOP_POSTER_VALUES  = /*[[${topPosterValues}]]*/          [];
/*]]>*/
</script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
  /* ── Helpers ───────────────────────────────────────────────── */
  const isDark    = () => document.documentElement.getAttribute('data-theme') !== 'light';
  const gridClr   = () => isDark() ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.07)';
  const tickClr   = () => isDark() ? '#94a3b8' : '#64748b';
  const ttBg      = () => isDark() ? '#1c2535' : '#ffffff';
  const ttBorder  = () => isDark() ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.1)';
  const ttTitle   = () => isDark() ? '#f0f4ff' : '#0f172a';
  const ttBody    = () => isDark() ? '#94a3b8'  : '#334155';

  Chart.defaults.font.family = "'DM Sans', sans-serif";
  Chart.defaults.font.size   = 12;

  const PALETTE = [
    'rgba(139,92,246,.85)',
    'rgba(52,211,153,.85)',
    'rgba(96,165,250,.85)',
    'rgba(251,191,36,.85)',
    'rgba(248,113,113,.85)',
  ];

  function tooltipCfg() {
    return {
      backgroundColor: ttBg(), borderColor: ttBorder(), borderWidth: 1,
      titleColor: ttTitle(), bodyColor: ttBody(), padding: 10, cornerRadius: 8,
    };
  }

  /* ── 1. Doughnut: Tipo de usuário ───────────────────────── */
  new Chart(document.getElementById('chartUserType'), {
    type: 'doughnut',
    data: {
      labels: ['Candidatos', 'Recrutadores'],
      datasets: [{
        data: [STATS_CANDIDATOS, STATS_RECRUTADORES],
        backgroundColor: ['rgba(52,211,153,.8)', 'rgba(251,191,36,.8)'],
        borderColor:     ['rgba(52,211,153,1)',   'rgba(251,191,36,1)'],
        borderWidth: 2, hoverOffset: 8,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: {
        legend: { position:'bottom', labels:{ color:tickClr(), font:{size:11}, padding:16, usePointStyle:true, pointStyleWidth:8 }},
        tooltip: { ...tooltipCfg(), callbacks:{ label: ctx => `  ${ctx.label}: ${ctx.raw}` }},
      },
    },
  });

  /* ── 2. Doughnut: Vagas por modalidade ─────────────────── */
  const modalLabels = Object.keys(MODALIDADE_DATA);
  const modalValues = Object.values(MODALIDADE_DATA);
  new Chart(document.getElementById('chartModalidade'), {
    type: 'doughnut',
    data: {
      labels: modalLabels,
      datasets: [{
        data: modalValues,
        backgroundColor: PALETTE.slice(0, modalLabels.length),
        borderColor:     PALETTE.slice(0, modalLabels.length).map(c => c.replace('.85','1')),
        borderWidth: 2, hoverOffset: 8,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: {
        legend: { position:'bottom', labels:{ color:tickClr(), font:{size:11}, padding:16, usePointStyle:true, pointStyleWidth:8 }},
        tooltip: { ...tooltipCfg() },
      },
    },
  });

  /* ── 3. Bar: Vagas por nível ────────────────────────────── */
  new Chart(document.getElementById('chartNivel'), {
    type: 'bar',
    data: {
      labels: Object.keys(NIVEL_DATA),
      datasets: [{
        label: 'Vagas', data: Object.values(NIVEL_DATA),
        backgroundColor: 'rgba(139,92,246,.7)', borderColor: 'rgba(139,92,246,1)',
        borderWidth: 2, borderRadius: 7, borderSkipped: false,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{ display:false }, tooltip:{ ...tooltipCfg() }},
      scales: {
        x: { grid:{ color:gridClr() }, ticks:{ color:tickClr() }},
        y: { grid:{ color:gridClr() }, ticks:{ color:tickClr(), stepSize:1, precision:0 }, beginAtZero:true },
      },
    },
  });

  /* ── 4. Horizontal bar: Top postadores ─────────────────── */
  new Chart(document.getElementById('chartTopPosters'), {
    type: 'bar',
    data: {
      labels: TOP_POSTER_NAMES,
      datasets: [{
        label: 'Posts', data: TOP_POSTER_VALUES,
        backgroundColor: PALETTE, borderWidth: 0, borderRadius: 7, borderSkipped: false,
      }],
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        tooltip: { ...tooltipCfg(), callbacks:{ label: ctx => `  ${ctx.raw} post${ctx.raw!==1?'s':''}` }},
      },
      scales: {
        x: { grid:{ color:gridClr() }, ticks:{ color:tickClr(), stepSize:1, precision:0 }, beginAtZero:true },
        y: { grid:{ display:false }, ticks:{ color:tickClr() }},
      },
    },
  });

  /* ── Menu de usuário ──────────────────────────────────────── */
  function toggleUserMenu(e) {
    e.stopPropagation();
    document.getElementById('user-menu')?.classList.toggle('hidden');
  }
  function closeUserMenu() {
    document.getElementById('user-menu')?.classList.add('hidden');
  }
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('user-menu');
    const btn  = document.getElementById('user-avatar-btn');
    if (menu && !menu.classList.contains('hidden') &&
        !menu.contains(e.target) && e.target !== btn) {
      menu.classList.add('hidden');
    }
  });

  /* ── Logout ───────────────────────────────────────────────── */
  async function doLogout() {
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('firstech_access_token') || '') }
      });
    } catch {}
    localStorage.removeItem('firstech_access_token');
    window.location.href = '/';
  }
</script>
</body>
</html>
