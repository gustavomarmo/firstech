<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, footerText, footerLink, footerHref)"
      class="dark" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | Firstech'">Firstech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwindConfig.js}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
    <style>
        body {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(138,96,194,.10) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(138,96,194,.05) 0%, transparent 40%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        :root {
            --color-on-surface-variant: #c7c4d7;
            --color-primary: #8a60c2;
            --color-error: #ffb4ab;
            --color-tertiary: #7bd0ff;
        }
        input, button, select, textarea { font-family: inherit; }
    </style>
</head>
<body class="font-base text-base leading-[1.6] text-white bg-surface-dim min-h-screen flex items-center justify-center p-6">

<div class="fixed w-px pointer-events-none top-[10%] left-[5%] h-24 bg-[linear-gradient(to_bottom,rgba(138,96,194,.4),transparent)] opacity-20"></div>
<div class="fixed w-px pointer-events-none bottom-[20%] right-[10%] h-32 bg-[linear-gradient(to_top,rgba(123,208,255,.4),transparent)] opacity-20"></div>

<main class="w-full max-w-[480px] relative z-10">

    <div class="flex flex-col items-center mb-5 text-center">
        <img th:src="@{/img/logo.png}" alt="Firstech Logo"
             class="h-[150px] w-auto object-contain drop-shadow-[0_0_20px_rgba(138,96,194,.3)]"/>
    </div>

    <div class="bg-white/5 backdrop-blur-[20px] border border-white/10 shadow-[0_0_40px_rgba(138,96,194,.03)] rounded-xl px-8 py-7 relative overflow-hidden">
        <div th:replace="${content}"></div>
        <div class="absolute -right-16 -bottom-16 w-32 h-32 bg-[rgba(138,96,194,.10)] blur-[48px] rounded-full pointer-events-none"></div>
        <div class="absolute -left-16 -top-16 w-32 h-32 bg-[rgba(123,208,255,.10)] blur-[48px] rounded-full pointer-events-none"></div>
    </div>

    <footer class="mt-4 text-center" th:if="${footerText != null}">
        <p class="text-on-surface-var">
            <span th:text="${footerText}"></span>
            <a th:href="${footerHref}" th:text="${footerLink}"
               class="text-primary text-sm font-semibold no-underline ml-1 transition-[text-decoration] duration-200 hover:underline hover:underline-offset-4"></a>
        </p>
        <div class="mt-4 flex justify-center gap-6 opacity-30 grayscale transition-[opacity,filter] duration-500 hover:opacity-100 hover:grayscale-0">
            <span class="text-xs font-medium tracking-[.1em] uppercase text-outline">MADE BY BIANCA E GUSTAVO</span>
        </div>
    </footer>

</main>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
