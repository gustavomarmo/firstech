<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(
          'New password',
          ~{::main-content},
          'Remembered your password?',
          'Enter',
          '/login'
      )}">
<body>
<th:block th:fragment="main-content">

    <header class="mb-5 text-center">
        <h1 class="text-[26px] font-bold tracking-[-0.02em] leading-tight">New password</h1>
        <p class="text-on-surface-var mt-1.5 text-sm">Type your new password below.</p>
    </header>

    <form id="resetForm" class="flex flex-col gap-3" novalidate>

        <input type="hidden" id="token" name="token" th:value="${token}"/>

        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold tracking-[0.05em] text-on-surface-var ml-1" for="newPassword">NEW PASSWORD</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none select-none" aria-hidden="true">lock_reset</span>
                <input id="newPassword" name="newPassword" type="password"
                       class="w-full bg-surface-low border border-outline-var rounded-lg py-[11px] pr-12 pl-11 text-white text-base transition-[border-color,box-shadow] duration-300 outline-none placeholder:text-[rgba(144,143,160,.5)] focus:border-primary focus:shadow-[0_0_0_1px_#8a60c2] disabled:opacity-50 disabled:cursor-not-allowed"
                       placeholder="8 characters minimum" required autocomplete="new-password"/>
                <button type="button"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-outline text-[20px] bg-transparent border-none cursor-pointer p-0 flex items-center transition-colors duration-200 hover:text-primary"
                        data-toggle-password="newPassword" aria-label="Show/hide password">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit"
                class="w-full bg-primary text-white text-sm font-semibold tracking-[0.05em] border-none rounded-lg py-3 cursor-pointer flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(138,96,194,.2)] transition-[filter,transform] duration-300 hover:brightness-110 active:scale-[.98] disabled:opacity-60 disabled:cursor-not-allowed"
                data-label="Redefinir senha" data-icon="check_circle">
            <span class="btn-label">Reset password</span>
            <span class="material-symbols-outlined btn-icon" aria-hidden="true">check_circle</span>
        </button>

    </form>

</th:block>
</body>
</html>
