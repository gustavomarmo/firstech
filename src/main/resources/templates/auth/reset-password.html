<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(
          'New password',
          ~{::main-content},
          'Remembered your password?',
          'Enter',
          '/login'
      )}">
<body>
<th:block th:fragment="main-content">

    <header class="auth-header">
        <h1>New password</h1>
        <p>Type your new password below.</p>
    </header>

    <form id="resetForm" class="auth-form" novalidate>

        <input type="hidden" id="token" name="token" th:value="${token}"/>

        <div class="form-group">
            <label class="form-label" for="newPassword">NEW PASSWORD</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">lock_reset</span>
                <input id="newPassword" name="newPassword" type="password"
                       class="form-input has-right-icon"
                       placeholder="8 characters minimum" required autocomplete="new-password"/>
                <button type="button" class="icon-right"
                        data-toggle-password="newPassword" aria-label="Show/hide password">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary"
                data-label="Redefinir senha" data-icon="check_circle">
            <span class="btn-label">Reset password</span>
            <span class="material-symbols-outlined btn-icon" aria-hidden="true">check_circle</span>
        </button>

    </form>

</th:block>
</body>
</html>
