<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(
          'Nova senha',
          ~{::main-content},
          'Lembrou sua senha?',
          'Entrar',
          '/login'
      )}">
<body>
<th:block th:fragment="main-content">

    <header class="auth-header">
        <h1>New password</h1>
        <p>Digite sua nova senha abaixo.</p>
    </header>

    <form id="resetForm" class="auth-form" novalidate>

        <!--
            O token vem como query param: /reset-password?token=XXXX
            O controller injeta no modelo; o Thymeleaf coloca num campo hidden.
        -->
        <input type="hidden" id="token" name="token" th:value="${token}"/>

        <!-- Nova senha -->
        <div class="form-group">
            <label class="form-label" for="newPassword">NOVA SENHA</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">lock_reset</span>
                <input id="newPassword" name="newPassword" type="password"
                       class="form-input has-right-icon"
                       placeholder="Mínimo 8 caracteres" required autocomplete="new-password"/>
                <button type="button" class="icon-right"
                        data-toggle-password="newPassword" aria-label="Mostrar/ocultar senha">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary"
                data-label="Redefinir senha" data-icon="check_circle">
            <span class="btn-label">Redefinir senha</span>
            <span class="material-symbols-outlined btn-icon" aria-hidden="true">check_circle</span>
        </button>

    </form>

</th:block>
</body>
</html>
