<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(
          'Create account',
          ~{::main-content},
          'Already a member?',
          'Enter',
          '/login'
      )}">
<body>
<th:block th:fragment="main-content">

    <header class="auth-header">
        <h1>Join the network</h1>
        <p>Create your account and start your journey.</p>
    </header>

    <form id="registerForm" class="auth-form" novalidate>

        <div class="form-group">
            <label class="form-label" for="name">NAME</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">person</span>
                <input id="name" name="name" type="text" class="form-input"
                       placeholder="Seu nome completo" required autocomplete="name"/>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">E-MAIL</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">alternate_email</span>
                <input id="email" name="email" type="email" class="form-input"
                       placeholder="candidato@cefsa.edu.br" required autocomplete="email"/>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">PASSWORD</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">lock</span>
                <input id="password" name="password" type="password" class="form-input has-right-icon"
                       placeholder="8 characters minimum" required autocomplete="new-password"/>
                <button type="button" class="icon-right"
                        data-toggle-password="password" aria-label="Show/hide password">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary"
                data-label="Criar conta" data-icon="person_add">
            <span class="btn-label">Create account</span>
            <span class="material-symbols-outlined btn-icon" aria-hidden="true">person_add</span>
        </button>

    </form>

</th:block>
</body>
</html>
