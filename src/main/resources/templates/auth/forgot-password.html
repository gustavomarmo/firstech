<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(
          'Redefinir acesso',
          ~{::main-content},
          null, null, null
      )}">
<body>
<th:block th:fragment="main-content">

    <header class="auth-header">
        <h1>Reset access</h1>
        <p>Informe seu e-mail e enviaremos um link de redefinição.</p>
    </header>

    <form id="forgotForm" class="auth-form" novalidate>

        <!-- E-mail -->
        <div class="form-group">
            <label class="form-label" for="email">E-MAIL</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined icon" aria-hidden="true">alternate_email</span>
                <input id="email" name="email" type="email" class="form-input"
                       placeholder="visionary@firstech.io" required autocomplete="email"/>
            </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary"
                data-label="Enviar link" data-icon="send">
            <span class="btn-label">Enviar link</span>
            <span class="material-symbols-outlined btn-icon" aria-hidden="true">send</span>
        </button>

        <div style="text-align:center; margin-top: 4px;">
            <a href="/login" class="link-subtle">← Voltar ao login</a>
        </div>

    </form>

</th:block>
</body>
</html>
